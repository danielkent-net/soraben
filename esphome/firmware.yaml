substitutions:
  devicename: soraben
  device_name: soraben
  human_device_name: "Soraben"
  light_pwm_rate: '50000Hz'
  cwww_cool_pin: GPIO28
  cwww_warm_pin: GPIO27
  fan_relay_pin: GPIO0
  sda_bus1: 18
  scl_bus1: 19
  sda_bus2: 20
  scl_bus2: 21

esphome:
  name: ${devicename}
  comment: ${human_device_name}

external_components:   
    - source: github://pr#14623
      components: [ sen6x ]
    - source: github://pr#14375
      components: [ sen6x ]
    - source: github://pr#14269
      components: [ sensirion_common ]

logger:
  level: DEBUG
  baud_rate: 115200
  
rp2040:
  board: rpipicow
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${devicename}_fallback"
    password: !secret ap_password
    ap_timeout: 120min

      
api:
  encryption:
    key: !secret encryption_key
  id: ${devicename}

ota:
  platform: esphome
  password: !secret ota_password

i2c:
  sda: ${sda_bus2}
  scl: ${scl_bus2}
  scan: false
  id: i2c_bus2

sensor:
  - platform: sen6x
    id: ${devicename}_sen6x
    i2c_id: i2c_bus2
    type: SEN66
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      accuracy_decimals: 0
    voc:
      name: "VOC"
      algorithm_tuning:
        index_offset: 100
        learning_time_offset_hours: 12
        learning_time_gain_hours: 12
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    co2:
      name: "CO2"
      accuracy_decimals: 0
      automatic_self_calibration: false
      altitude_compensation: 270

  - platform: aqi
    name: "Air Quality Index"
    pm_2_5: pm_2_5
    pm_10_0: pm_10_0
    calculation_type: AQI

light:
  - platform: cwww
    name: "Soraben Light"
    id: ${devicename}_light
    cold_white: cool_pin
    warm_white: warm_pin
    cold_white_color_temperature: 6000K
    warm_white_color_temperature: 3000K
    constant_brightness: True

switch:
    - platform: gpio
      name: "BentoBox Filter"
      id: ${devicename}_fan_relay
      pin: ${fan_relay_pin}
      icon: mdi:air-filter

output:
  - platform: rp2040_pwm
    pin: ${cwww_warm_pin}
    id: warm_pin
    frequency: ${light_pwm_rate}

  - platform: rp2040_pwm
    pin: ${cwww_cool_pin}
    id: cool_pin
    frequency: ${light_pwm_rate}

